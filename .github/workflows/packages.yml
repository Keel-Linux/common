# The overlay packages of packages/ (handbook decision 0041, first
# implementation, step 2). The checks are "packages / build" and
# "packages / install".
#
# build: each package built, source and binary, with dpkg-buildpackage, and
# both linted with lintian, any error or warning failing (packages/build).
# Nothing is signed or published; the files are kept as the artifact
# overlay-debs.
#
# install: the four packages installed with their real dependencies in a
# trixie container, then tests/overlay-install.bats: keel manifest validate
# on the machine, and the units of etcd and CrowdSec after a first
# installation, a purge, a remove and reinstall, a transition from a unit
# already enabled, and real version upgrades of the Debian packages and of
# the overlay. The job
# container is the image build's case: systemd is not PID 1, and the job
# writes the policy-rc.d that exits 101 fab installs under. The is-active assertions need a running systemd and are made on
# a booted container instead (packages/README.md); everything systemctl
# answers offline is asserted here.
#
# keel, inithooks and confconsole are not published yet (Keel-Linux/apt:
# the signing subkey is being rotated), so they are built here from the
# commits pinned below: keel 0.12.0 (Keel-Linux/keel#57), inithooks
# 2.3.6+keel14 and confconsole 2.2.3+keel8, the versions
# keel-overlay-installer depends on. Their own tests are their CI's. Their
# TurnKey dependencies (turnkey-ssl, turnkey-netinfo, turnkey-conffile) come
# from the TurnKey trixie archive, with the key common already ships.
name: packages

on:
  pull_request:
  push:
    branches: [19.x]

permissions:
  contents: read

env:
  KEEL_COMMIT: 3c6e45636d9a3c9fb5e04fac3a0aecf7bfc8b58a
  INITHOOKS_COMMIT: 2543d506590a17a762a4288e2ee99b0a3c160386
  CONFCONSOLE_COMMIT: 71828736ca7e99fff1d99ce5e9e9002c24dbd8b2
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git build-essential debhelper lintian
      - uses: actions/checkout@v4
      - name: Build and lint every overlay package
        run: |
          set -o pipefail
          packages/build 2>&1 | tee build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-debs
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Install the tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git gnupg bats systemd build-essential debhelper
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: overlay-debs
          path: dist
      - name: Build keel, inithooks and confconsole at the pinned commits
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps"
          for pinned in keel:"$KEEL_COMMIT" inithooks:"$INITHOOKS_COMMIT" \
                        confconsole:"$CONFCONSOLE_COMMIT"; do
            repo="${pinned%%:*}"
            commit="${pinned#*:}"
            src="$RUNNER_TEMP/src/$repo"
            git init -q "$src"
            git -C "$src" fetch -q --depth 1 \
              "https://github.com/Keel-Linux/$repo.git" "$commit"
            git -C "$src" checkout -q FETCH_HEAD
            apt-get build-dep -y -qq --no-install-recommends "$src"
            (cd "$src" && dpkg-buildpackage -us -uc -b)
            mv "$RUNNER_TEMP/src/"*.deb "$RUNNER_TEMP/deps/"
          done
          ls -l "$RUNNER_TEMP/deps"
      - name: Install the four overlay packages with their dependencies
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d
          gpg --dearmor \
            < overlays/bootstrap_apt/usr/share/keyrings/tkl-trixie-main.asc \
            > /usr/share/keyrings/tkl-trixie-main.gpg
          echo "deb [signed-by=/usr/share/keyrings/tkl-trixie-main.gpg] https://archive.turnkeylinux.org/debian trixie main" \
            > /etc/apt/sources.list.d/turnkey.list
          apt-get update -qq
          apt-get install -y -q --no-install-recommends \
            "$RUNNER_TEMP"/deps/*.deb ./dist/*.deb
      - name: Unit states and manifests on the machine
        run: |
          set -o pipefail
          KEEL_OVERLAY_INSTALL_TEST=1 bats tests/overlay-install.bats 2>&1 \
            | tee install.txt
