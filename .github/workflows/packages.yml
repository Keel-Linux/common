# The overlay packages of packages/ (handbook decision 0041, first
# implementation, step 2). The checks are "build / trixie" and
# "install / trixie".
#
# Both jobs run in a Debian trixie system container, an unprivileged LXC
# container with its own systemd on the self-hosted runner keel-lxc-1,
# through the reusable workflow lxc-trixie.yml of Keel-Linux/.github. Keel
# runs no application containers in CI. A pull request from a fork never
# reaches the self-hosted runner, so it gets no build, lint or install
# result here.
#
# build: each package built, source and binary, with dpkg-buildpackage, and
# both linted with lintian, any error or warning failing (packages/build).
# Nothing is signed or published; the files are kept as the artifact
# overlay-debs.
#
# install: the four packages installed with their real dependencies in a
# booted trixie container, then tests/overlay-install.bats: keel manifest
# validate on the machine, and the units of etcd and CrowdSec after a first
# installation, a purge, a remove and reinstall, a transition from a unit
# already enabled, and real version upgrades of the Debian packages and of
# the overlay. The job writes the policy-rc.d that exits 101 fab installs
# under. systemd is PID 1 in the container, so the is-active assertions are
# made as well; the image build's case, no /run/systemd/system, is the one
# the suite reproduces itself where it needs it.
#
# keel, inithooks and confconsole are not published yet (Keel-Linux/apt:
# the signing subkey is being rotated), so they are built here from the
# commits pinned below: keel 0.12.0 (Keel-Linux/keel#57), inithooks
# 2.3.6+keel14 and confconsole 2.2.3+keel8, the versions
# keel-overlay-installer depends on. Their own tests are their CI's. Their
# TurnKey dependencies (turnkey-ssl, turnkey-netinfo, turnkey-conffile) come
# from the TurnKey trixie archive, with the key common already ships.
name: packages

on:
  pull_request:
  push:
    branches: [19.x]

permissions:
  contents: read

jobs:
  build:
    uses: keel-linux/.github/.github/workflows/lxc-trixie.yml@main
    with:
      timeout: 20
      artifact-dir: dist
      artifact-name: overlay-debs
      run: |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          ca-certificates git build-essential debhelper lintian
        packages/build

  install:
    needs: build
    uses: keel-linux/.github/.github/workflows/lxc-trixie.yml@main
    with:
      systemd: true
      timeout: 30
      download: overlay-debs
      download-dir: dist
      run: |
        KEEL_COMMIT=3c6e45636d9a3c9fb5e04fac3a0aecf7bfc8b58a
        INITHOOKS_COMMIT=2543d506590a17a762a4288e2ee99b0a3c160386
        CONFCONSOLE_COMMIT=71828736ca7e99fff1d99ce5e9e9002c24dbd8b2
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          ca-certificates git gnupg bats build-essential debhelper
        # keel, inithooks and confconsole at the pinned commits
        mkdir -p /tmp/deps
        for pinned in keel:"$KEEL_COMMIT" inithooks:"$INITHOOKS_COMMIT" \
                      confconsole:"$CONFCONSOLE_COMMIT"; do
          repo="${pinned%%:*}"
          commit="${pinned#*:}"
          src="/tmp/src/$repo"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 \
            "https://github.com/Keel-Linux/$repo.git" "$commit"
          git -C "$src" checkout -q FETCH_HEAD
          apt-get build-dep -y -qq --no-install-recommends "$src"
          (cd "$src" && DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b)
          mv /tmp/src/*.deb /tmp/deps/
        done
        ls -l /tmp/deps
        # the four overlay packages with their dependencies, under the
        # policy-rc.d fab installs under
        printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
        chmod 0755 /usr/sbin/policy-rc.d
        gpg --dearmor \
          < overlays/bootstrap_apt/usr/share/keyrings/tkl-trixie-main.asc \
          > /usr/share/keyrings/tkl-trixie-main.gpg
        echo "deb [signed-by=/usr/share/keyrings/tkl-trixie-main.gpg] https://archive.turnkeylinux.org/debian trixie main" \
          > /etc/apt/sources.list.d/turnkey.list
        apt-get update -qq
        apt-get install -y -q --no-install-recommends /tmp/deps/*.deb ./dist/*.deb
        # unit states and manifests on the machine
        KEEL_OVERLAY_INSTALL_TEST=1 bats tests/overlay-install.bats
