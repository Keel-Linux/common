# Light CI on GitHub-hosted runners, for pull requests on the GitHub mirror
# (decision 0056). The full CI is .forgejo/workflows on git.pop.coop, and
# .forgejo/workflows/packages.yml has the notes on each job.
#
# Jobs on Forgejo only (no GitHub-hosted version): install, syncthing, web.
name: packages

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: keel-linux/.github/.github/workflows/github-debian-build.yml@main
    with:
      timeout: 20
      artifact-dir: dist
      artifact-name: overlay-debs
      run: |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          ca-certificates git build-essential debhelper lintian
        packages/build
