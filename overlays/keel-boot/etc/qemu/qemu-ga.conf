# The QEMU guest agent of a Keel machine (handbook decision 0099).
#
# Only the boot layer installs qemu-guest-agent, so only a virtual machine
# or a real machine from the ISO has this file. A container has neither.
#
# allow-rpcs is an allow-list: qemu-ga refuses every command that is not
# in it. These are the commands that Proxmox VE 8 and 9 send by themselves
# (the handshake, the agent check, the IP addresses on the Summary page,
# the file system freeze of a backup, a snapshot or a clone, fstrim after
# a disk move, and the shutdown), and read-only information commands.
#
# The agent cannot run a command, read or write a file, set a password,
# change an SSH key, set the clock, or change the CPUs or the memory.
# "qm guest exec", "qm guest passwd" and "qm agent ... file-read" fail.
#
# The list is separated by commas, with no spaces. A wrong name in the
# list only disables that command, it does not open the others.
[general]
allow-rpcs=guest-sync-delimited,guest-sync,guest-ping,guest-info,guest-get-osinfo,guest-get-host-name,guest-get-time,guest-get-timezone,guest-network-get-interfaces,guest-get-fsinfo,guest-get-disks,guest-get-vcpus,guest-get-memory-blocks,guest-get-memory-block-info,guest-fsfreeze-status,guest-fsfreeze-freeze,guest-fsfreeze-freeze-list,guest-fsfreeze-thaw,guest-fstrim,guest-shutdown
