# keel-overlay-etcd: etcd restarted one member at a time (keel's
# docs/mesh.md, "keel mesh etcd gate, and upgrades"). etcd-server's
# postinst restarts etcd on every upgrade and knows nothing of the other
# members: apt run on two members of three at once would lose the
# majority while both restart. Before etcd is sent SIGTERM, the gate
# waits until every other voter is healthy and no other member is
# restarting, and takes the mesh's restart lock (a key on a lease of
# 120 s); once etcd started, it waits until this member is back in the
# majority and releases the lock. A stop is never refused for good:
# after 300 s the gate lets it go on, and at shutdown it does not wait.
# On a node in no etcd cluster the gate passes at once. Both run as root
# (+), which reads keel's etcd client certificate; etcd itself still runs
# as the etcd user. A failed start gate fails nothing (-).
[Service]
ExecStop=+/usr/bin/keel mesh etcd gate stop
ExecStartPost=-+/usr/bin/keel mesh etcd gate started
TimeoutStopSec=330
TimeoutStartSec=180
