# keel-overlay-anubis: what a location of Keel Web says to send its
# requests through Anubis (handbook decisions 0030 and 0042: protect.anubis
# of a site). Installed as /etc/nginx/snippets/keel-anubis.conf, included
# inside a location; keel renders the sites that include it.
#
# Anubis keys on the client's address, so it gets it in X-Real-IP; what it
# allows it hands back to Nginx on unix:/run/nginx/keel-app.sock (TARGET
# in /etc/anubis/keel.env), whose server trusts X-Real-IP from unix: only.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_pass http://[::1]:8923;
