# keel-overlay-anubis: anubis@keel.service, Keel Web's Anubis, starts
# only after its signing key is there. The anubis package's unit refuses
# to start without /etc/anubis/keel.key; keel-overlay-anubis-key.service
# makes it when it is missing, so keel spec apply, which only enables and
# starts the unit, gets a key on the first start.
[Unit]
Requires=keel-overlay-anubis-key.service
After=keel-overlay-anubis-key.service
