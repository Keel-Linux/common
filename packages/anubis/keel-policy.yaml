# keel-overlay-anubis: the policy of anubis@keel.service (handbook decision
# 0062, the Nextcloud appliance: a sync client carries no browser and no
# cookie, and must pass the challenge it cannot solve).
#
# Anubis reads one policy file (POLICY_FNAME in /etc/anubis/keel.env),
# evaluates the bots list in the order it stands in, and the first rule
# that matches wins. So the drop-in directory of an appliance comes first:
# a file of /etc/anubis/keel.d/ may allow what the rest of the policy would
# challenge or deny, and nothing below can take that back. The glob is
# fatal at startup when it matches no file, and the package ships
# keel-placeholder.yaml so the directory is never empty.
#
# Anubis reads an imported file as a list of rules, not as a policy, so
# this file cannot import upstream's /etc/anubis/botPolicies.yaml. After
# the drop-ins it imports (data)/meta/default-config.yaml, the list of
# rules that upstream's default policy holds, from the Anubis binary. The
# sections below the bots list are those of upstream's default policy of
# anubis 1.27.0, without their comments: what version 1 of this package
# ran. tests/overlay-web.bats starts Anubis with this file.
bots:
  - import: /etc/anubis/keel.d/*.yaml
  - import: (data)/meta/default-config.yaml

dnsbl: false

honeypot:
  enabled: true
  implementation: naive

openGraph:
  enabled: false
  considerHost: false
  ttl: 24h

status_codes:
  CHALLENGE: 200
  DENY: 200

store:
  backend: memory
  parameters: {}

thresholds:
  - name: minimal-suspicion
    expression: weight <= 0
    action: ALLOW
  - name: mild-suspicion
    expression:
      all:
        - weight > 0
        - weight < 10
    action: CHALLENGE
    challenge:
      algorithm: metarefresh
      difficulty: 1
  - name: moderate-suspicion
    expression:
      all:
        - weight >= 10
        - weight < 20
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 2
  - name: mild-proof-of-work
    expression:
      all:
        - weight >= 20
        - weight < 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4
  - name: extreme-suspicion
    expression: weight >= 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 6
