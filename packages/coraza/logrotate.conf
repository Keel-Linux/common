# keel-overlay-coraza: the rotation of Coraza's audit log. Not in
# /etc/logrotate.d: keel-overlay-coraza-logrotate.timer runs logrotate on
# this file alone every hour, with its own state, so a flood of blocked
# requests is cut at 100 MiB within the hour instead of at the next daily
# run. Copied and truncated, since Coraza keeps the file open; as
# www-data, whose directory it is.
/var/log/coraza/audit.log {
	daily
	maxsize 100M
	missingok
	rotate 14
	compress
	delaycompress
	notifempty
	copytruncate
	su www-data www-data
}
