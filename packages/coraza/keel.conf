# keel-overlay-coraza: Coraza with the OWASP Core Rule Set, for every
# server of Nginx's http block (handbook decision 0030), in the http
# context.
#
# /etc/nginx/conf.d/keel-coraza.conf links here only while the overlay is
# enabled, together with the module's own link,
# /etc/nginx/modules-enabled/50-mod-http-coraza.conf: Nginx refuses these
# directives while the module is not loaded, and the module is not loaded
# while the overlay is disabled (step 5 measured about 15 MiB in every
# worker with no rule loaded; with the Core Rule Set a worker grows from
# about 4 to about 65 MiB). /usr/lib/keel/overlays/coraza/state makes and
# removes both
# links, and checks the result.
coraza on;
coraza_transaction_id $request_id;
coraza_rules_file /etc/nginx/coraza/keel-rules.conf;

# The response headers go out as they come, not held until phase 4. Held
# (the module's default), a static file answered with gzip is an empty
# gzip stream while sendfile is on, as Debian's nginx.conf has it, so a
# browser gets blank pages (Keel-Linux/libnginx-mod-http-coraza#2).
# Measured on the Keel Web image with 0.21.0-0keel1: with this off the
# page comes back whole and the Core Rule Set still answers 403 in phase
# 2; what is lost is the clean error page of a phase 4 deny, which now
# resets the connection instead (still blocked). `sendfile off` was the
# other way, and cannot be said here: nginx.conf sets sendfile in the
# same http context, and nginx -t refuses the duplicate. Remove this once
# libnginx-mod-http-coraza 0.21.0-0keel2 (Keel-Linux/libnginx-mod-http-coraza#3)
# is the one installed.
coraza_delay_response_headers off;
