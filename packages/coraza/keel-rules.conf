# keel-overlay-coraza: the rules Coraza applies to every request of the
# http block, read from /etc/nginx/coraza/keel.conf. Blocking, with the
# OWASP Core Rule Set of the coreruleset package in the order it requires.
#
# Exclusions and local rules go in coreruleset's own files under
# /etc/coreruleset (REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf and
# RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf). A rule Coraza refuses still
# passes `nginx -t`, and then every worker dies at the next reload
# (upstream corazawaf/coraza-nginx#139): turn the overlay off and on again
# with /usr/lib/keel/overlays/coraza/state, which checks the workers and
# the probe and rolls back, rather than reloading Nginx by hand.
SecRuleEngine On
SecRequestBodyAccess On

# The audit log. Nginx's error log says only "Coraza: Access denied with
# code 403, unique_id ..."; this file says which rules matched. One JSON
# object a line, whose transaction id is that unique_id, and whose
# messages[].error_message are the matches in ModSecurity's format
# ([id "..."] [msg "..."] [data "..."] [severity "..."]), which CrowdSec
# can parse. Logged: what was blocked, and every answer 4xx or 5xx other
# than a 404 (Go's regular expressions have no lookahead, hence the
# spelling). Parts A, H and Z: the client and the matches (each names the
# host and the URI), never a header or a body. Part B, the request
# headers, is left out: it carries Cookie and Authorization, and Coraza
# has no action to redact them (no sanitiseRequestHeader). The workers
# create the WAF and write the file as www-data, so it cannot be root's:
# file 0600 and directory 0700, www-data's alone (and root's). Rotated at
# 100 MiB or daily, checked every hour by keel-overlay-coraza-logrotate.timer
# (/etc/keel-overlay-coraza/logrotate.conf), copied and truncated, since
# Coraza keeps it open.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?:0[0-35-9]|[1-9]))"
SecAuditLogParts AHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLogFileMode 0600
SecAuditLog /var/log/coraza/audit.log

Include /etc/nginx/coraza/keel-exclusions.conf
Include /usr/share/coreruleset/coreruleset.load
