# keel-overlay-coraza: the rules Coraza applies to every request of the
# http block, read from /etc/nginx/coraza/keel.conf. Blocking, with the
# OWASP Core Rule Set of the coreruleset package in the order it requires.
#
# Exclusions and local rules go in coreruleset's own files under
# /etc/coreruleset (REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf and
# RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf). A rule Coraza refuses still
# passes `nginx -t`, and then every worker dies at the next reload
# (upstream corazawaf/coraza-nginx#139): turn the overlay off and on again
# with /usr/lib/keel/overlays/coraza/state, which checks the workers and
# the probe and rolls back, rather than reloading Nginx by hand.
SecRuleEngine On
SecRequestBodyAccess On

# The request body. Coraza selects a body processor only for a form (URL
# encoded or multipart). Without a rule for the content type, the Core
# Rule Set reads any other body as one URL encoded argument
# (REQUEST-901, rule 901350). Two defects came from that, both measured on
# a container of 2 GB (Coraza 0.21.0, Core Rule Set 4.25.1):
#
#   - a JSON text was the name of one argument, and each "&" in it began
#     another one, so the block editor of WordPress could not save
#     (Keel-Linux/common#59);
#   - a binary body of 1 MB (an image sent as image/jpeg) was one argument
#     of 1 MB. The rules matched it again and again: one worker used 800 MB
#     and 30 s of CPU, and a body of 3 MB stopped the container
#     (Keel-Linux/keel-web#15). A text form of 1 MB took 40 s.
#
# So, in this order:
#   1. JSON and XML bodies get their processors (the rules of
#      coraza.conf-recommended, with the "+json" and "+xml" types);
#   2. a form, JSON or XML body of more than 256 KiB is refused with 413.
#      The rules need about 10 s of CPU for each MiB of such a body, so a
#      big one is a cost for the machine. A page of 256 KiB is about
#      40000 words. SecRequestBodyLimit counts the files of a multipart
#      body, and an upload is more than 256 KiB, so the limit is set with
#      ctl in phase 1, for these types only. A rule of the operator in
#      coreruleset's REQUEST-900 file can set ctl:requestBodyLimit again,
#      later in the same phase. Nginx limits the size of an upload first
#      (client_max_body_size);
#   3. a body of any other type is not read: the Core Rule Set has no
#      argument to match in it. The rule 920420 of the Core Rule Set still
#      scores a type its policy does not allow.
# A file of a multipart body is no argument, so an upload of any size that
# Nginx accepts passes with a bounded worker (measured: 32 MiB, +10 MiB of
# memory). Rule ids 10010 to 10013 are Keel's.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^application/(?:[a-z0-9.+-]+\+)?json(?:$|[ ;])" \
    "id:10010,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:requestBodyProcessor=JSON"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^(?:application|text)/(?:[a-z0-9.+-]+\+)?xml(?:$|[ ;])" \
    "id:10011,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:requestBodyProcessor=XML"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^(?:application/x-www-form-urlencoded|application/(?:[a-z0-9.+-]+\+)?json|(?:application|text)/(?:[a-z0-9.+-]+\+)?xml)(?:$|[ ;])" \
    "id:10012,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:requestBodyLimit=262144"

SecRule REQUEST_HEADERS:Content-Type "!@rx (?i)^(?:application/x-www-form-urlencoded|multipart/form-data|application/(?:[a-z0-9.+-]+\+)?json|(?:application|text)/(?:[a-z0-9.+-]+\+)?xml)(?:$|[ ;])" \
    "id:10013,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:requestBodyAccess=Off"

SecRequestBodyLimit 134217728
SecRequestBodyLimitAction Reject
SecRequestBodyInMemoryLimit 131072

# The audit log. Nginx's error log says only "Coraza: Access denied with
# code 403, unique_id ..."; this file says which rules matched. One JSON
# object a line, whose transaction id is that unique_id, and whose
# messages[].error_message are the matches in ModSecurity's format
# ([id "..."] [msg "..."] [data "..."] [severity "..."]), which CrowdSec
# can parse. Logged: what was blocked, and every answer 4xx or 5xx other
# than a 404 (Go's regular expressions have no lookahead, hence the
# spelling). Parts A, H and Z: the client and the matches (each names the
# host and the URI), never a header or a body. Part B, the request
# headers, is left out: it carries Cookie and Authorization, and Coraza
# has no action to redact them (no sanitiseRequestHeader). The workers
# create the WAF and write the file as www-data, so it cannot be root's:
# file 0600 and directory 0700, www-data's alone (and root's). Rotated at
# 100 MiB or daily, checked every hour by keel-overlay-coraza-logrotate.timer
# (/etc/keel-overlay-coraza/logrotate.conf), copied and truncated, since
# Coraza keeps it open.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?:0[0-35-9]|[1-9]))"
SecAuditLogParts AHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLogFileMode 0600
SecAuditLog /var/log/coraza/audit.log

Include /etc/nginx/coraza/keel-exclusions.conf
Include /usr/share/coreruleset/coreruleset.load
