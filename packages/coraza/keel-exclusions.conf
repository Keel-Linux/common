# keel-overlay-coraza: the exclusions Keel ships, read from
# /etc/nginx/coraza/keel-rules.conf before the OWASP Core Rule Set. The
# operator's own go in coreruleset's files under /etc/coreruleset, as
# keel-rules.conf says. Rule ids 10000 to 10099 are Keel's, in the range
# ModSecurity leaves to local rules (1 to 99999).

# Anubis (keel-overlay-anubis) answers under /.within.website/. Its
# challenge page sends the browser to
# /.within.website/x/cmd/anubis/api/pass-challenge with `redir`, the URL
# the visitor asked for. Opened by IP, that URL names an IP, and the Core
# Rule Set scored 5, the blocking threshold: no browser passed the
# challenge by IP. By IPv4, CRS 931100 ("Possible Remote File Inclusion
# (RFI) Attack: URL Parameter using IP Address"); by IPv6, whose URL
# brackets the address, CRS 932130 ("Remote Command Execution: Unix Shell
# Expression Found", which reads /[...] as a shell glob). Anubis checks
# redir itself before it redirects. So on Anubis's paths only, and for
# redir only, the remote file inclusion rules (tag attack-rfi) and 932130
# do not look at it; every other rule still does, and every other argument
# and path keeps them all.
SecRule REQUEST_FILENAME "@beginsWith /.within.website/" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:redir,\
    ctl:ruleRemoveTargetById=932130;ARGS:redir"
