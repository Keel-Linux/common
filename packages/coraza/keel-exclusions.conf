# keel-overlay-coraza: the exclusions Keel ships, read from
# /etc/nginx/coraza/keel-rules.conf before the OWASP Core Rule Set. The
# operator's own go in coreruleset's files under /etc/coreruleset, as
# keel-rules.conf says. Rule ids 10000 to 10099 are Keel's, in the range
# ModSecurity leaves to local rules (1 to 99999).

# Anubis (keel-overlay-anubis) sends the browser that solved its challenge
# to /.within.website/x/cmd/anubis/api/pass-challenge with `redir`, the
# URL the visitor first asked for. Opened by IP, that URL names an IP, and
# the Core Rule Set scored 5, the blocking threshold, so no browser passed
# the challenge by IP: by IPv4 CRS 931100 ("Possible Remote File
# Inclusion (RFI) Attack: URL Parameter using IP Address"), by IPv6 CRS
# 932130 ("Remote Command Execution: Unix Shell Expression Found", which
# reads the brackets of https://[2001:db8::1]/ as a shell glob).
#
# So for that one path, and for redir only, those two rules do not look
# at it; every other rule still does, and every other argument and path
# keeps both. The path is compared whole, once decoded and with its dot
# segments resolved, as Nginx routes it: a prefix of the raw path would
# let /.within.website/../x.php or %2e%2e through to another location
# with the rules lifted.
#
# Anubis does not check redir's host on its own: unless REDIRECT_DOMAINS
# is set it compares the URL's host with itself (lib/anubis.go,
# PassChallenge) and redirects anywhere. keel-web sets REDIRECT_DOMAINS
# to the machine's own names and addresses.
SecRule REQUEST_FILENAME "@streq /.within.website/x/cmd/anubis/api/pass-challenge" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,t:urlDecodeUni,t:normalisePath,\
    ctl:ruleRemoveTargetById=931100;ARGS:redir,\
    ctl:ruleRemoveTargetById=932130;ARGS:redir"
