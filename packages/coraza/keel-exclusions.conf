# keel-overlay-coraza: the exclusions Keel ships, read from
# /etc/nginx/coraza/keel-rules.conf before the OWASP Core Rule Set. The
# operator's own go in coreruleset's files under /etc/coreruleset, as
# keel-rules.conf says. Rule ids 10000 to 10099 are Keel's, in the range
# ModSecurity leaves to local rules (1 to 99999).

# Anubis (keel-overlay-anubis) sends the browser that solved its challenge
# to /.within.website/x/cmd/anubis/api/pass-challenge with `redir`, the
# URL the visitor first asked for. Opened by IP, that URL names an IP, and
# the Core Rule Set scored 5, the blocking threshold, so no browser passed
# the challenge by IP: by IPv4 CRS 931100 ("Possible Remote File
# Inclusion (RFI) Attack: URL Parameter using IP Address"), by IPv6 CRS
# 932130 ("Remote Command Execution: Unix Shell Expression Found", which
# reads the brackets of https://[2001:db8::1]/ as a shell glob).
#
# So for that one path, and for redir only, those two rules do not look
# at it; every other rule still does, and every other argument and path
# keeps both. The request is what Anubis serves as pass-challenge and
# nothing it hands on to the application:
#
#   - GET only: Anubis routes pass-challenge for GET, and a POST or PUT to
#     the same path falls through to its "/" handler, which proxies it to
#     the application once the challenge is passed;
#   - the path compared whole, as Nginx and Anubis route it: Coraza's
#     REQUEST_FILENAME is already decoded once, so it is not decoded again
#     (pass-%2563hallenge would match and reach the application), and its
#     dot segments are resolved, since a prefix of the raw path would let
#     /.within.website/../x.php or %2e%2e through to another location.
#
# Anubis does not check redir's host on its own: unless REDIRECT_DOMAINS
# is set it compares the URL's host with itself (lib/anubis.go,
# PassChallenge) and redirects anywhere. keel-web sets REDIRECT_DOMAINS
# to the machine's own names and addresses.
SecRule REQUEST_METHOD "@streq GET" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@streq /.within.website/x/cmd/anubis/api/pass-challenge" \
        "t:none,t:normalisePath,\
        ctl:ruleRemoveTargetById=931100;ARGS:redir,\
        ctl:ruleRemoveTargetById=932130;ARGS:redir"

# Opened by a *.localhost name (RFC 6761: only the machine itself resolves
# one, so only a browser on it can have sent the request), that same URL
# names localhost, and CRS 934190 ("Scheme-less localhost or internal
# hostname", attack-ssrf, read from ssrf-no-scheme.data) scored 5 and
# blocked pass-challenge, so no browser passed the challenge by such a
# name.
#
# So on that one path, for GET only and with the path compared as rule
# 10001 compares it, 934190 does not read redir when all of this holds,
# and only then:
#
#   - there is exactly one redir, query and body together (hence phase 2,
#     where the body's arguments are in ARGS): a second one would ride on
#     the exclusion of the first;
#   - the request's Host is localhost or a name under it, with or without
#     a port, and nothing else;
#   - redir is an https URL whose host is that very Host, port included,
#     followed by "/": "https://web.localhost/" and its paths, never
#     another localhost name, a longer name that starts with it, or user
#     information that makes another host the URL's. Plain http is not
#     lifted: the cloud modes serve the challenge over HTTPS only.
#
# 934190 is the only rule lifted; every other one still reads redir. No
# server-side request follows redir: Anubis answers with a redirect to it,
# for the browser, and since anubis#3 only to the request's own host.
SecRule REQUEST_METHOD "@streq GET" \
    "id:10002,\
    phase:2,\
    pass,\
    nolog,\
    t:none,\
    chain"
    SecRule REQUEST_FILENAME "@streq /.within.website/x/cmd/anubis/api/pass-challenge" \
        "t:none,t:normalisePath,\
        chain"
    SecRule &ARGS:redir "@eq 1" \
        "chain"
        SecRule REQUEST_HEADERS:Host "@rx ^((?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)*localhost(?::[0-9]{1,5})?)$" \
            "t:none,t:lowercase,\
            capture,\
            chain"
            SecRule ARGS:redir "@beginsWith https://%{tx.1}/" \
                "t:none,t:lowercase,\
                ctl:ruleRemoveTargetById=934190;ARGS:redir"
