# keel-overlay-nginx: /keel-health, the probe of the "nginx" check of the
# overlay manifest (/usr/share/keel/overlays/nginx.yaml, handbook decision
# 0041), answering 204 without touching any application. Installed as
# /etc/nginx/conf.d/keel-health.conf, inside Debian's http block (decision
# 0042, "What keel renders").
#
# It listens on the loopback addresses only, IPv6 first, so nothing outside
# the machine reaches it. Nginx gives a request to the servers that listen
# on the exact address it arrived on before those that listen on every
# address, so this server is the one that answers on [::1]:80 and
# 127.0.0.1:80, whatever Host it names: a site is reached through its own
# addresses, and Keel Web's internal hops use unix sockets (0042).
server {
    listen [::1]:80;
    listen 127.0.0.1:80;

    location = /keel-health {
        allow ::1;
        allow 127.0.0.1;
        deny all;
        # try_files, not return: return answers in the rewrite phase,
        # before Coraza sees the request, and the waf-blocks probe of
        # keel-overlay-coraza must reach the WAF. No file has this name,
        # so the answer is always the 204.
        try_files /.keel-health-is-no-file =204;
    }

    location / {
        return 404;
    }
}
