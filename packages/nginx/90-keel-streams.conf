# keel-overlay-nginx: the stream block of Keel Web (handbook decision
# 0042, "Where stream goes, and why there"). Debian's nginx.conf includes
# modules-enabled/*.conf in the main context and has no stream include;
# this file sorts after 50-mod-stream.conf, which loads the module, and
# reads the stream servers from streams-enabled/, as sites-enabled/ holds
# the http ones. An empty stream block is valid.
stream {
    include /etc/nginx/streams-enabled/*;
}
